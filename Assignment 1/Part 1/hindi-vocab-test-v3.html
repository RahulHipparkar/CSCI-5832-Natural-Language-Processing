<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hindi vocabulary test</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ground:#EDEAE4;--panel:#F7F5F1;--ink:#1B1A17;--muted:#6A655C;--rule:#C3BCB0;

 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
 --sans:"IBM Plex Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
 display:flex;justify-content:center;padding:26px 18px 60px}
.wrap{width:100%;max-width:660px}
.head{position:relative;height:3px;background:var(--rule)}
.head .fill{position:absolute;left:0;top:0;height:3px;background:var(--ink);width:0;transition:width .18s}
.meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;
 letter-spacing:.06em;color:var(--muted);padding-top:9px;text-transform:uppercase}
.stage{padding:66px 0 48px;text-align:center}
.word{font-family:var(--dev);font-size:72px;line-height:1.55;word-break:break-word}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:20px;letter-spacing:.05em}
.choices{display:grid;gap:9px}
.btn{border:1px solid var(--rule);background:var(--panel);color:var(--ink);font-family:var(--sans);
 font-size:14.5px;text-align:left;padding:13px 15px;cursor:pointer;border-top-width:3px;
 display:flex;gap:13px;align-items:baseline;width:100%}
.btn:hover{background:#fff}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn .k{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:14px}
.btn .lab{font-weight:600}.btn .sub{color:var(--muted);font-size:13px}
.b2{border-top-color:var(--know)}.b1{border-top-color:var(--partial)}.b0{border-top-color:var(--unknown)}
.foot{margin-top:20px;display:flex;justify-content:space-between;font-family:var(--mono);
 font-size:11px;color:var(--muted)}
.link{background:none;border:none;color:var(--muted);font-family:var(--mono);font-size:11px;
 cursor:pointer;text-decoration:underline;padding:0}
h1{font-size:19px;font-weight:600;margin:0 0 6px}
h2{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;
 color:var(--muted);font-weight:500;border-top:1px solid var(--rule);padding-top:8px;margin:28px 0 10px}
p{font-size:14.5px;line-height:1.62;color:#2C2A25}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--rule);
 padding:6px 8px 6px 0;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:6px 8px 6px 0;border-bottom:1px solid #DED8CE}
td.n{text-align:right}
.big{font-family:var(--mono);font-size:31px;font-weight:500;margin:4px 0 2px}
.cap{font-size:12.5px;color:var(--muted);line-height:1.55}
pre{background:var(--panel);border:1px solid var(--rule);border-top-width:3px;padding:13px;
 font-family:var(--mono);font-size:11.5px;overflow-x:auto;white-space:pre-wrap;line-height:1.55}
input[type=text]{width:100%;padding:11px 12px;font-family:var(--sans);font-size:15px;
 border:1px solid var(--rule);border-top:3px solid var(--know);background:#fff;color:var(--ink)}
.warn{border-top:3px solid var(--unknown);background:var(--panel);padding:12px 14px;margin:12px 0}
.ok{border-top:3px solid var(--know);background:var(--panel);padding:12px 14px;margin:12px 0}
.chip{display:inline-block;border:1px solid var(--rule);border-top:3px solid var(--flag);
 background:var(--panel);padding:6px 10px;margin:3px 4px 3px 0;cursor:pointer;
 font-family:var(--dev);font-size:15px}
.chip.on{background:var(--flag);color:#fff}
.dl{border:1px solid var(--ink);background:var(--ink);color:#fff;font-family:var(--sans);
 font-size:14px;font-weight:600;padding:12px 18px;cursor:pointer;width:100%;margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:520px){.word{font-size:54px}.stage{padding:48px 0 36px}}
